name: Build apps (Windows EXE + Android APK)

# How to run: GitHub > Actions > "Build apps" > Run workflow.  Takes about 10-20 minutes.
# Then open the "Releases" page of the repository: the .exe and the .apk are there to download.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release name (for example v1.0.0)"
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write stats settings (optional - empty means stats are off)
        shell: bash
        env:
          TURL: ${{ secrets.TELEMETRY_URL }}
          TKEY: ${{ secrets.TELEMETRY_KEY }}
        run: printf '{"url":"%s","key":"%s"}' "$TURL" "$TKEY" > static/telemetry.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Download ffmpeg (bundled into the exe)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ff
          Copy-Item "ff\*\bin\ffmpeg.exe" desktop\
          Copy-Item "ff\*\bin\ffprobe.exe" desktop\
      - name: Download deno (needed by yt-dlp for YouTube)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath denoout
          Copy-Item "denoout\deno.exe" desktop\
      - name: Build the app (one folder = fast start)
        run: pyinstaller --noconfirm desktop/ERROR-HUB.spec
      - name: Portable zip (unzip anywhere, run ERROR-HUB-DOWNLODER.exe)
        shell: pwsh
        run: Compress-Archive -Path dist\ERROR-HUB-DOWNLODER -DestinationPath ERROR-HUB-DOWNLODER-portable.zip
      - name: Setup installer (installs once, then opens fast; optional step)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=${{ github.run_number }}" desktop\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            ERROR-HUB-DOWNLODER-portable.zip
            installer/ERROR-HUB-DOWNLODER-Setup.exe
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write stats settings (optional - empty means stats are off)
        shell: bash
        env:
          TURL: ${{ secrets.TELEMETRY_URL }}
          TKEY: ${{ secrets.TELEMETRY_KEY }}
        run: printf '{"url":"%s","key":"%s"}' "$TURL" "$TKEY" > static/telemetry.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Copy the app code into the Android project
        run: |
          cp app.py android/app/src/main/python/app.py
          mkdir -p android/app/src/main/assets
          cp -r static android/app/src/main/assets/static
      - name: Build apk
        run: gradle -p android assembleDebug --no-daemon --console=plain
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ERROR-HUB-DOWNLODER.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ERROR-HUB-DOWNLODER.apk

  release:
    needs: [windows, android]
    if: ${{ !cancelled() && (needs.windows.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ERROR HUB DOWNLODER ${{ github.event.inputs.tag || github.ref_name }}
          files: out/*
