name: Build the Android apk
description: Builds the Android apk and puts it into the release

inputs:
  telemetry_url:
    description: optional stats address
    required: false
    default: ""
  telemetry_key:
    description: optional stats key
    required: false
    default: ""
  allowed_emails:
    description: optional list of allowed Google accounts
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Write stats settings (optional - empty means stats are off)
      shell: bash
      env:
        TURL: ${{ inputs.telemetry_url }}
        TKEY: ${{ inputs.telemetry_key }}
      run: printf '{"url":"%s","key":"%s"}' "$TURL" "$TKEY" > static/telemetry.json

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.9"

    - name: Accept Android licenses
      shell: bash
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

    - name: Copy the app code into the Android project
      shell: bash
      run: |
        cp app.py android/app/src/main/python/app.py
        mkdir -p android/app/src/main/assets
        cp -r static android/app/src/main/assets/static

    - name: Allowed Google accounts for the phone app (optional)
      shell: bash
      env:
        ALLOWED: ${{ inputs.allowed_emails }}
      run: |
        printf '%s\n' "$ALLOWED" | tr ',; ' '\n\n\n' | sed '/^$/d' > android/app/src/main/assets/allowed.txt
        echo "allowed accounts:"; cat android/app/src/main/assets/allowed.txt || true

    - name: Download ffmpeg for the phone (arm64, optional)
      shell: bash
      run: |
        mkdir -p android/app/src/main/jniLibs/arm64-v8a
        OUT=android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so
        ( curl -fL --retry 4 --retry-delay 5 -o ffmpeg-arm64.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-arm64.gz \
          && gunzip -f ffmpeg-arm64.gz && cp ffmpeg-arm64 "$OUT" ) \
        || ( curl -fL --retry 4 --retry-delay 5 -o ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz \
          && tar -xJf ff.tar.xz && cp ffmpeg-*-arm64-static/ffmpeg "$OUT" ) \
        || echo "ffmpeg for the phone could NOT be downloaded"
        if [ -f "$OUT" ]; then chmod 755 "$OUT"; ls -la "$OUT"; file "$OUT" || true; else echo "::warning::no ffmpeg in the apk"; fi
        exit 0

    - name: Download QuickJS for the phone (small JavaScript engine that YouTube needs, optional)
      shell: bash
      run: |
        mkdir -p android/app/src/main/jniLibs/arm64-v8a
        ( curl -L --retry 4 --retry-delay 5 -o android/app/src/main/jniLibs/arm64-v8a/libqjs.so https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-linux-aarch64 \
          && chmod 755 android/app/src/main/jniLibs/arm64-v8a/libqjs.so ) || echo "QuickJS for the phone skipped"
        exit 0

    - name: Build apk
      shell: bash
      run: gradle -p android assembleDebug --no-daemon --console=plain

    - name: Find the apk and name it
      shell: bash
      run: |
        find android/app/build/outputs -name "*.apk" -exec ls -la {} \;
        APK=$(find android/app/build/outputs -name "*.apk" | head -n 1)
        if [ -z "$APK" ]; then echo "::error::the build made no apk file"; exit 1; fi
        cp "$APK" ERROR-HUB-DOWNLODER.apk
        ls -la ERROR-HUB-DOWNLODER.apk

    - uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: ERROR-HUB-DOWNLODER.apk

    - name: Put the apk into the release (tries 3 times)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.inputs.tag || github.ref_name }}
      run: |
        echo "release name: $TAG"
        ok=""
        for i in 1 2 3; do
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "ERROR HUB DOWNLODER $TAG" --notes "Windows: ERROR-HUB-DOWNLODER.exe. Android: ERROR-HUB-DOWNLODER.apk." || true
          if gh release upload "$TAG" ERROR-HUB-DOWNLODER.apk --clobber --repo "$GITHUB_REPOSITORY"; then ok=1; break; fi
          echo "attempt $i failed, waiting..."; sleep 15
        done
        if [ -z "$ok" ]; then echo "::error::could not put the apk into the release. The apk is still in this run's Artifacts (bottom of the run page)."; exit 1; fi

    - name: Show what the build made (only if something failed)
      if: ${{ failure() }}
      shell: bash
      run: |
        ls -la
        find android/app/build -maxdepth 4 | head -50 || true
