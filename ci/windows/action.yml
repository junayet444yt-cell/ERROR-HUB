name: Build the Windows exe
description: Builds the Windows exe (plus zip and installer) and puts them into the release

inputs:
  telemetry_url:
    description: optional stats address
    required: false
    default: ""
  telemetry_key:
    description: optional stats key
    required: false
    default: ""
  run_number:
    description: build number
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Write stats settings (optional - empty means stats are off)
      shell: bash
      env:
        TURL: ${{ inputs.telemetry_url }}
        TKEY: ${{ inputs.telemetry_key }}
      run: printf '{"url":"%s","key":"%s"}' "$TURL" "$TKEY" > static/telemetry.json

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python packages
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt pyinstaller

    - name: Download ffmpeg and deno (optional, bundled into the exe)
      shell: pwsh
      run: |
        $ProgressPreference = "SilentlyContinue"
        function Get-Retry($url, $out) {
          for ($i = 1; $i -le 3; $i++) { try { Invoke-WebRequest -Uri $url -OutFile $out; return $true } catch { Start-Sleep -Seconds 5 } }
          return $false
        }
        try {
          if (Get-Retry "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" "ffmpeg.zip") {
            Expand-Archive ffmpeg.zip -DestinationPath ff
            Copy-Item "ff\*\bin\ffmpeg.exe" desktop\
            Copy-Item "ff\*\bin\ffprobe.exe" desktop\
          }
        } catch { Write-Host "ffmpeg skipped: $_" }
        try {
          if (Get-Retry "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" "deno.zip") {
            Expand-Archive deno.zip -DestinationPath denoout
            Copy-Item "denoout\deno.exe" desktop\
          }
        } catch { Write-Host "deno skipped: $_" }
        exit 0

    - name: Build the single exe
      shell: pwsh
      env:
        ONEFILE: "1"
      run: |
        pyinstaller --noconfirm --distpath dist-onefile --workpath build-onefile desktop/ERROR-HUB.spec
        if ($LASTEXITCODE -ne 0) { throw "the exe build failed" }
        Copy-Item dist-onefile\ERROR-HUB-DOWNLODER.exe .\ERROR-HUB-DOWNLODER.exe
        Get-ChildItem *.exe | Select-Object Name, Length

    - uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: ERROR-HUB-DOWNLODER.exe
        if-no-files-found: error

    - name: Extras - fast-start zip and installer (if one fails the exe is still released)
      shell: pwsh
      run: |
        try {
          pyinstaller --noconfirm desktop/ERROR-HUB.spec
          if ($LASTEXITCODE -eq 0) { Compress-Archive -Path dist\ERROR-HUB-DOWNLODER -DestinationPath ERROR-HUB-DOWNLODER-portable.zip }
        } catch { Write-Host "zip skipped: $_" }
        try {
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem -Path "C:\Program Files (x86)", "C:\Program Files", "$env:LOCALAPPDATA\Programs" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($iscc) {
            & $iscc.FullName "/DAppVer=${{ inputs.run_number }}" desktop\installer.iss
            if (Test-Path installer\ERROR-HUB-DOWNLODER-Setup.exe) { Move-Item installer\ERROR-HUB-DOWNLODER-Setup.exe . }
          }
        } catch { Write-Host "installer skipped: $_" }
        exit 0

    - name: Put the Windows files into the release (tries 3 times)
      if: ${{ always() }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.inputs.tag || github.ref_name }}
      run: |
        $files = @("ERROR-HUB-DOWNLODER.exe", "ERROR-HUB-DOWNLODER-Setup.exe", "ERROR-HUB-DOWNLODER-portable.zip") | Where-Object { Test-Path $_ }
        Write-Host "release name:" $env:TAG
        Write-Host "uploading:" $files
        if (-not $files) { throw "no Windows file was built" }
        $ok = $false
        for ($i = 1; $i -le 3; $i++) {
          gh release upload $env:TAG $files --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 0) { $ok = $true; break }
          Write-Host "attempt $i failed, waiting..."; Start-Sleep -Seconds 15
        }
        if (-not $ok) { throw "could not put the files into the release (they are still in this run's Artifacts)" }
