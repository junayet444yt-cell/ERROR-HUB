plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.errorhub.downloader'
    compileSdk 34

    defaultConfig {
        applicationId "com.errorhub.downloader"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"   // Python 3.12 supports 64-bit only (armeabi-v7a made the build fail)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        pip {
            install "flask==3.1.3"
            install "yt-dlp"
            install "certifi"
        }
    }
}
